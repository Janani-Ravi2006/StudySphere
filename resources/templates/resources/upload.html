<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resource</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg bg-white shadow-lg rounded-2xl p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">📂 Upload Resource</h2>
        
       <form method="post" enctype="multipart/form-data" class="space-y-5">
    {% csrf_token %}

    <div>
        <label class="block text-gray-700 font-semibold">Title</label>
        {{ form.title }}
    </div>

    <div>
        <label class="block text-gray-700 font-semibold">Description</label>
        {{ form.description }}
    </div>

    <div>
        <label class="block text-gray-700 font-semibold">File</label>
        {{ form.file }}
    </div>

    <div>
        <label class="block text-gray-700 font-semibold">Category</label>
        {{ form.category }}
    </div>

    <button type="submit" 
        class="w-full py-2 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow hover:bg-blue-700 transition duration-300">
        Upload
    </button>
</form>

    </div>

</body>
</html>

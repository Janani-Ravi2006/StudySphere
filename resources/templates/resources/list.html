<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h2 { text-align: center; }
        form { margin-bottom: 20px; display: flex; gap: 10px; }
        input, select, button { padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background-color: #fff; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #eee; }
        tr:hover { background-color: #f1f1f1; }
        .text-center { text-align: center; }
        .btn { background-color: #007bff; color: white; border: none; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>📑 Uploaded Resources</h2>

    <!-- Search & Filter Form -->
    <form method="get">
        <input type="text" name="search" placeholder="Search..." value="{{ query }}">
        <select name="category">
            <option value="">All Categories</option>
            {% for cat in categories %}
                <option value="{{ cat }}" {% if cat == category_filter %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn">Search</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Uploaded At</th>
                <th class="text-center">Download</th>
            </tr>
        </thead>
        <tbody>
            {% for resource in resources %}
            <tr>
                <td>{{ resource.title }}</td>
                <td>{{ resource.category.name }}</td>
                <td>{{ resource.uploaded_at|date:"M d, Y H:i" }}</td>
                <td class="text-center">
                    <a href="{{ resource.file.url }}">Download</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No resources uploaded yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>

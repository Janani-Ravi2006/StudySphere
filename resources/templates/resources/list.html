<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">📑 Uploaded Resources</h2>
        
        <div class="bg-white shadow rounded-2xl overflow-hidden">
            <table class="min-w-full table-auto">
                <thead class="bg-gray-200 text-gray-700">
                    <tr>
                        <th class="py-3 px-4 text-left">Title</th>
                        <th class="py-3 px-4 text-left">Category</th>
                        <th class="py-3 px-4 text-left">Uploaded At</th>
                        <th class="py-3 px-4 text-center">Download</th>
                    </tr>
                </thead>
                <tbody>
                    {% for resource in resources %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="py-3 px-4">{{ resource.title }}</td>
                        <td class="py-3 px-4">{{ resource.category.name }}</td>
                        <td class="py-3 px-4">{{ resource.uploaded_at|date:"M d, Y H:i" }}</td>
                        <td class="py-3 px-4 text-center">
                            <a href="{{ resource.file.url }}" 
                               class="text-blue-600 font-semibold hover:underline">Download</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="py-4 text-center text-gray-500">No resources uploaded yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
